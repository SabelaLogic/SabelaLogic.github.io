<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rose City Solar · Demo</title>
  <meta name="description" content="Demo: a solar landing page that opens on your city, with a WhatsApp quote button.">
  <meta name="theme-color" content="#0E6B4F">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <div class="ribbon" id="ribbon" hidden>Demo · fictional solar installer</div>

    <header class="hero">
      <div class="brand">
        <div class="logo" id="logo" aria-hidden="true">RS</div>
        <div>
          <p class="brand-name" id="brandName">Rose City Solar</p>
          <p class="tagline" id="tagline">Home solar, quoted on WhatsApp</p>
        </div>
      </div>

      <div class="switcher" id="switcher" role="group" aria-label="Choose a city"></div>
      <p class="geo" id="geoLine" data-ready="0" role="status" aria-live="polite">Checking where your connection is…</p>
    </header>

    <main>
      <h1 id="headline">Solar for your city</h1>
      <p class="blurb" id="blurb"></p>

      <ul class="benefits" id="benefits"></ul>

      <section class="price" aria-label="Price teaser">
        <p class="kicker">Price teaser</p>
        <p class="price-line" id="priceLine"></p>
        <p class="areas-label">Areas we serve</p>
        <ul class="areas" id="areas"></ul>
      </section>
    </main>

    <footer class="foot" id="footerNote"></footer>
  </div>

  <div class="cta-bar">
    <a class="wa" id="waBtn" href="https://wa.me/27710000000" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.34 4.94L2 22l5.39-1.4a10 10 0 0 0 4.65 1.18h.01c5.46 0 9.89-4.4 9.89-9.84C21.94 6.4 17.5 2 12.04 2Zm5.76 14.05c-.24.68-1.4 1.3-1.94 1.38-.5.07-1.12.1-1.81-.11-.41-.13-.95-.31-1.63-.6-2.87-1.24-4.74-4.13-4.88-4.32-.14-.19-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.26-.28.57-.35.76-.35h.55c.17 0 .41-.07.64.49.24.57.81 1.97.88 2.11.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.13-.28.28-.12.54.16.26.7 1.15 1.5 1.86 1.03.92 1.9 1.2 2.17 1.34.26.13.42.11.57-.07.16-.19.66-.77.84-1.03.17-.26.35-.22.58-.13.24.09 1.5.71 1.76.84.26.13.43.19.49.3.07.11.07.64-.17 1.32Z"/></svg>
      <span id="waLabel">WhatsApp a quote</span>
    </a>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
